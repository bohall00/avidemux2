name: Avidemux macOS (Catalina)
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      DEPS: ${{ github.workspace }}/deps
      QTDIR: ${{ github.workspace }}/Qt/5.15.2/clang_64
      ADM_DIR: /Volumes/AvidemuxBuild/avidemux2
      PKG_CONFIG_PATH: ${{ github.workspace }}/deps/lib/pkgconfig:${{ github.workspace }}/deps/share/pkgconfig
      CMAKE_PREFIX_PATH: ${{ github.workspace }}/deps
      DEPS_CACHE_REV: "2"
      ADM_BUILD_REV: "2"
    steps:
      - name: Install build tools
        run: brew install nasm yasm pkg-config meson ninja

      - name: Install CMake 3.31.6
        run: |
          set -eu
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz | tar xf -
          echo "$PWD/cmake-3.31.6-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"

      - name: Restore dependency cache
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.DEPS }}
            ${{ github.workspace }}/Qt
          key: avidemux-deps-r${{ env.DEPS_CACHE_REV }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: avidemux-deps-r${{ env.DEPS_CACHE_REV }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Qt 5.15.2 (official binaries, macOS 10.13+)
        run: |
          set -eu
          if [ ! -x "$QTDIR/bin/qmake" ]; then
            pipx install aqtinstall
            aqt install-qt mac desktop 5.15.2 clang_64 -O "${{ github.workspace }}/Qt"
          fi

      - name: Build dependencies (resumable, all targeting 10.15)
        id: build-deps
        run: |
          set -eux
          mkdir -p src "$DEPS"; cd src
          J=$(sysctl -n hw.ncpu)

          build_freetype() {
            curl -fsSL https://download.savannah.gnu.org/releases/freetype/freetype-2.13.3.tar.xz | tar xf -
            (cd freetype-2.13.3 && ./configure --prefix="$DEPS" --enable-shared --disable-static --without-harfbuzz --without-brotli --without-bzip2 --without-png && make -j$J && make install)
          }
          build_fribidi() {
            curl -fsSL https://github.com/fribidi/fribidi/releases/download/v1.0.16/fribidi-1.0.16.tar.xz | tar xf -
            (cd fribidi-1.0.16 && ./configure --prefix="$DEPS" --enable-shared --disable-static && make -j$J && make install)
          }
          build_harfbuzz() {
            curl -fsSL https://github.com/harfbuzz/harfbuzz/releases/download/10.1.0/harfbuzz-10.1.0.tar.xz | tar xf -
            meson setup hb-build harfbuzz-10.1.0 --prefix="$DEPS" -Ddefault_library=shared -Dfreetype=enabled -Dglib=disabled -Dicu=disabled -Dcairo=disabled -Dgobject=disabled -Dtests=disabled -Ddocs=disabled -Dbenchmark=disabled
            ninja -C hb-build install
          }
          build_expat() {
            curl -fsSL https://github.com/libexpat/libexpat/releases/download/R_2_6_4/expat-2.6.4.tar.xz | tar xf -
            (cd expat-2.6.4 && ./configure --prefix="$DEPS" --enable-shared --disable-static && make -j$J && make install)
          }
          build_fontconfig() {
            curl -fsSL https://www.freedesktop.org/software/fontconfig/release/fontconfig-2.15.0.tar.xz | tar xf -
            (cd fontconfig-2.15.0 && ./configure --prefix="$DEPS" --enable-shared --disable-static --disable-docs && make -j$J && make install)
          }
          build_libass() {
            curl -fsSL https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.xz | tar xf -
            (cd libass-0.17.3 && ./configure --prefix="$DEPS" --enable-shared --disable-static && make -j$J && make install)
          }
          build_lame() {
            curl -fsSL https://deb.debian.org/debian/pool/main/l/lame/lame_3.100.orig.tar.gz | tar xf -
            (cd lame-3.100 && find . -name '*.sym' -exec sed -i '' '/lame_init_old/d' {} + && ./configure --prefix="$DEPS" --enable-shared --disable-static --disable-frontend && make -j$J && make install)
          }
          build_opus() {
            curl -fsSL https://github.com/xiph/opus/releases/download/v1.5.2/opus-1.5.2.tar.gz | tar xf -
            (cd opus-1.5.2 && ./configure --prefix="$DEPS" --enable-shared --disable-static --disable-doc --disable-extra-programs && make -j$J && make install)
          }
          build_xvid() {
            curl -fsSL https://downloads.xvid.com/downloads/xvidcore-1.3.7.tar.gz | tar xf -
            (cd xvidcore/build/generic && ./configure --prefix="$DEPS" --enable-shared --disable-static && make -j$J && make install)
          }
          build_x264() {
            git clone --depth 1 https://code.videolan.org/videolan/x264.git
            (cd x264 && ./configure --prefix="$DEPS" --enable-shared --enable-pic --disable-cli --disable-opencl && make -j$J && make install)
          }
          build_vpx() {
            curl -fsSL https://github.com/webmproject/libvpx/archive/refs/tags/v1.15.0.tar.gz | tar xf -
            (cd libvpx-1.15.0 && CC=clang ./configure --target=x86_64-darwin19-gcc --prefix="$DEPS" --enable-shared --disable-static --enable-pic --disable-examples --disable-tools --disable-unit-tests --disable-docs && make -j$J && make install)
          }
          build_aom() {
            curl -fsSL https://storage.googleapis.com/aom-releases/libaom-3.11.0.tar.gz | tar xf -
            cmake -S libaom-3.11.0 -B aom-build -DCMAKE_INSTALL_PREFIX="$DEPS" -DCMAKE_BUILD_TYPE=Release -DENABLE_SHARED=ON -DENABLE_STATIC=OFF -DENABLE_TESTS=OFF -DENABLE_EXAMPLES=OFF -DENABLE_TOOLS=OFF -DENABLE_DOCS=OFF
            cmake --build aom-build -j$J && cmake --install aom-build
          }
          build_x265() {
            curl -fsSL https://bitbucket.org/multicoreware/x265_git/downloads/x265_4.1.tar.gz | tar xf -
            cmake -S x265_4.1/source -B x265-build -DCMAKE_INSTALL_PREFIX="$DEPS" -DCMAKE_BUILD_TYPE=Release -DENABLE_SHARED=ON -DENABLE_STATIC=OFF -DENABLE_CLI=OFF
            cmake --build x265-build -j$J && cmake --install x265-build
          }

          for lib in freetype fribidi harfbuzz expat fontconfig libass lame opus xvid x264 vpx aom x265; do
            if [ -e "$DEPS/.ok-$lib" ]; then echo "### $lib: already built, skipping"; continue; fi
            echo "### building $lib"
            build_$lib
            touch "$DEPS/.ok-$lib"
          done

      - name: Save dependency cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.DEPS }}
            ${{ github.workspace }}/Qt
          key: avidemux-deps-r${{ env.DEPS_CACHE_REV }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

      - name: Create case-sensitive build volume
        run: |
          set -eu
          hdiutil create -size 30g -type SPARSE -fs "Case-sensitive APFS" -volname AvidemuxBuild "$RUNNER_TEMP/AvidemuxBuild.sparseimage"
          hdiutil attach "$RUNNER_TEMP/AvidemuxBuild.sparseimage"
          sudo chown "$(id -un)" /Volumes/AvidemuxBuild

      - name: Get upstream commit
        id: upstream
        run: echo "sha=$(git ls-remote https://github.com/mean00/avidemux2.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore Avidemux build cache
        id: cache-adm
        uses: actions/cache/restore@v4
        with:
          path: /Volumes/AvidemuxBuild/avidemux2
          key: avidemux-build-${{ steps.upstream.outputs.sha }}-r${{ env.ADM_BUILD_REV }}-deps-r${{ env.DEPS_CACHE_REV }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: avidemux-build-${{ steps.upstream.outputs.sha }}-r${{ env.ADM_BUILD_REV }}-deps-r${{ env.DEPS_CACHE_REV }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Avidemux
        id: build-adm
        run: |
          set -eux
          cd /Volumes/AvidemuxBuild
          if [ ! -d avidemux2/.git ]; then
            git clone --recursive https://github.com/mean00/avidemux2.git
          fi
          cd avidemux2
          sed -i '' \
            -e 's|cat cmake/avidemuxVersion.cmake|cat avidemux_core/cmake/avidemuxVersion.cmake|g' \
            -e 's|/cmake/osx/|/avidemux/qt4/cmake/osx/|g' \
            -e 's|${QTDIR}/share/qt/plugins|${QTDIR}/plugins|g' \
            bootStrapOsx_Catalina.bash
          export MYQT="$QTDIR"
          bash bootStrapOsx_Catalina.bash --nopkg --rebuild --with-internal-liba52 --with-internal-libmp4v2

      - name: Save Avidemux build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /Volumes/AvidemuxBuild/avidemux2
          key: avidemux-build-${{ steps.upstream.outputs.sha }}-r${{ env.ADM_BUILD_REV }}-deps-r${{ env.DEPS_CACHE_REV }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

      - name: Resolve library references
        run: |
          set -eu
          APP=$(find "$ADM_DIR" -maxdepth 1 -name 'Avidemux*.app' | head -1)
          find "$APP/Contents" -type f -print0 | while IFS= read -r -d '' f; do
            otool -L "$f" 2>/dev/null | awk 'NR>1 {print $1}' | while read -r dep; do
              case "$dep" in /*|@executable_path/*|@loader_path/*) continue ;; esac
              name=${dep#@rpath/}
              if [ -f "$DEPS/lib/$name" ]; then
                install_name_tool -change "$dep" "$DEPS/lib/$name" "$f"
              fi
            done
          done

      - name: Package DMG
        id: package
        run: |
          set -eux
          cd "$ADM_DIR"
          export MYQT="$QTDIR"
          export PATH="$QTDIR/bin:$PATH"
          V=$(awk -F'"' '/CPACK_PACKAGE_VERSION_MAJOR /{M=$2} /CPACK_PACKAGE_VERSION_MINOR /{m=$2} /CPACK_PACKAGE_VERSION_P /{p=$2} END{print M"."m"."p}' avidemux_core/cmake/avidemuxVersion.cmake)
          MM=$(awk -F'"' '/CPACK_PACKAGE_VERSION_MAJOR /{M=$2} /CPACK_PACKAGE_VERSION_MINOR /{m=$2} END{print M"."m}' avidemux_core/cmake/avidemuxVersion.cmake)
          rm -rf installer; mkdir installer; cd installer
          cmake -DAVIDEMUX_VERSION="$V" -DAVIDEMUX_MAJOR_MINOR="$MM" -DENABLE_QT5=True ../avidemux/osxInstaller
          make package

      - name: Verify the app is self-contained
        run: |
          set -eu
          APP=$(find "$ADM_DIR/installer" -maxdepth 1 -name '*.app' | head -1)
          leaks=$(find "$APP/Contents" -type f -print0 \
            | xargs -0 -I{} sh -c 'otool -L "{}" 2>/dev/null' \
            | grep -E "$DEPS|/Qt/5\.15\.2|/usr/local/|/opt/homebrew" || true)
          if [ -n "$leaks" ]; then echo "Unbundled references:"; echo "$leaks"; exit 1; fi
          echo "OK: app is self-contained"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: avidemux-macos-catalina
          path: /Volumes/AvidemuxBuild/avidemux2/installer/*.dmg
